# TenantCache Multi-Tenant Web Application Lab
# SECURITY WARNING: This compose environment packages an intentionally vulnerable
# reverse-proxy cache configuration for local testing and differential verification.
# All ports are strictly bound to loopback (127.0.0.1) to prevent accidental LAN/WAN exposure.

services:
  app:
    build:
      context: .
      dockerfile: lab/application/Dockerfile
    container_name: tenantcache_app
    ports:
      # Bound strictly to 127.0.0.1 to prevent external exposure
      - "127.0.0.1:8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - tenantcache_net

  proxy:
    build:
      context: .
      dockerfile: lab/nginx/Dockerfile
    container_name: tenantcache_proxy
    ports:
      # Bound strictly to 127.0.0.1 to prevent external exposure of vulnerable proxy
      - "127.0.0.1:8080:80"
    depends_on:
      - app
    networks:
      - tenantcache_net

networks:
  tenantcache_net:
    driver: bridge
