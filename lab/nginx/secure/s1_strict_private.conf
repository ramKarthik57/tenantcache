# Secure Control Archetype S1: Strict Cache Bypass for Authenticated Requests
# Defense: Any request carrying an Authorization header or Session Cookie bypasses the proxy cache entirely.
# Caching is restricted strictly to unauthenticated public assets.

events { worker_connections 1024; }

http {
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=SECURE_CACHE_S1:10m max_size=100m inactive=60m use_temp_path=off;

    upstream backend {
        server app:8000;
    }

    server {
        listen 80;
        server_name localhost;

        location / {
            proxy_pass http://backend;
            proxy_set_header Host $host;

            proxy_cache SECURE_CACHE_S1;
            proxy_cache_key "$scheme$request_method$host$request_uri";

            # SECURE CONTROL S1: Bypass cache whenever Authorization header is present
            proxy_cache_bypass $http_authorization $cookie_session_id;
            proxy_no_cache $http_authorization $cookie_session_id;

            proxy_cache_valid 200 10m;
            # Respect backend Cache-Control headers (private, no-store, etc.)
            proxy_ignore_headers Expires;

            add_header X-Cache-Status $upstream_cache_status always;
            add_header X-TenantCache-Config "SECURE_S1_STRICT_PRIVATE" always;
        }
    }
}
