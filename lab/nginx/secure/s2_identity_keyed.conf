# Secure Control Archetype S2: Server-Validated Identity Keying with Per-Request Auth Verification
# Defense: Proxy validates authorization via subrequest (auth_request) on every request,
# ensuring revoked permissions cannot be served from cache. Cache keys use server-verified identity variables.

events { worker_connections 1024; }

http {
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=SECURE_CACHE_S2:10m max_size=100m inactive=60m use_temp_path=off;

    upstream backend {
        server app:8000;
    }

    server {
        listen 80;
        server_name localhost;

        location / {
            # Strip unauthenticated client identity headers
            proxy_set_header X-Tenant-ID "";
            proxy_set_header X-User-ID "";

            # Mandatory authorization check before serving from cache
            auth_request /_auth_verify;
            auth_request_set $auth_tenant $upstream_http_x_auth_tenant_id;
            auth_request_set $auth_user $upstream_http_x_auth_user_id;

            proxy_pass http://backend;
            proxy_set_header Host $host;

            proxy_cache SECURE_CACHE_S2;
            # Key partitions by request URI and server-derived identity variables
            proxy_cache_key "$scheme$request_method$host$request_uri|$auth_tenant|$auth_user";
            proxy_ignore_headers Cache-Control Expires;
            proxy_cache_valid 200 10m;

            add_header X-Cache-Status $upstream_cache_status always;
            add_header X-TenantCache-Config "SECURE_S2_IDENTITY_KEYED" always;
            add_header X-Auth-Tenant $auth_tenant always;
            add_header X-Auth-User $auth_user always;
        }

        location = /_auth_verify {
            internal;
            proxy_pass http://backend/api/v1/auth/verify;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header X-Original-Method $request_method;
            proxy_set_header Authorization $http_authorization;
        }
    }
}
