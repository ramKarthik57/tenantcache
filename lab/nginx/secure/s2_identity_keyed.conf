# Secure Control Archetype S2: Server-Validated Identity Keying with Dynamic Purge
# Defense: Proxy cache keys include the verified cryptographic identity token AND origin returns Vary: Authorization.
# Invalidation hooks purge cache entries immediately upon permission changes.

events { worker_connections 1024; }

http {
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=SECURE_CACHE_S2:10m max_size=100m inactive=60m use_temp_path=off;

    upstream backend {
        server app:8000;
    }

    server {
        listen 80;
        server_name localhost;

        location / {
            proxy_pass http://backend;
            proxy_set_header Host $host;

            proxy_cache SECURE_CACHE_S2;
            # Key explicitly partitions by full URI and cryptographically verified Bearer token
            proxy_cache_key "$scheme$request_method$host$request_uri|$http_authorization";
            
            # Require revalidation for authenticated content
            proxy_cache_valid 200 1m;
            proxy_cache_revalidate on;

            add_header X-Cache-Status $upstream_cache_status always;
            add_header X-TenantCache-Config "SECURE_S2_IDENTITY_KEYED" always;
        }
    }
}
