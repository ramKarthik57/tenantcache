# Vulnerability Archetype V1: Missing Tenant Context in Cache Key
# Root Cause: The cache key uses solely scheme, method, host, and request_uri.
# Any endpoint returning tenant-specific data for the same URI (e.g. /api/v1/tenant/dashboard)
# will be cached and served across completely different tenants!

events { worker_connections 1024; }

http {
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=TENANT_CACHE_V1:10m max_size=100m inactive=60m use_temp_path=off;

    upstream backend {
        server app:8000;
    }

    server {
        listen 80;
        server_name localhost;

        location / {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            # VULNERABILITY V1: Missing tenant or user identifier in proxy_cache_key
            proxy_cache TENANT_CACHE_V1;
            proxy_cache_key "$scheme$request_method$host$request_uri";
            proxy_cache_valid 200 10m;
            proxy_cache_use_stale error timeout updating;
            
            # Intentionally ignore backend Cache-Control to demonstrate aggressive proxy caching
            proxy_ignore_headers Cache-Control Expires;

            add_header X-Cache-Status $upstream_cache_status always;
            add_header X-TenantCache-Config "VULNERABLE_V1_MISSING_TENANT_KEY" always;
        }
    }
}
