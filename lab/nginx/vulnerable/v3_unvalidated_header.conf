# Vulnerability Archetype V3: Unvalidated Client Header in Cache Key
# Root Cause: The cache key includes the untrusted client-supplied header $http_x_tenant_id.
# An attacker in Tenant B sends X-Tenant-ID: tenant_acme with their own token, causing cache pollution
# or cache poisoning collisions against Acme.

events { worker_connections 1024; }

http {
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=TENANT_CACHE_V3:10m max_size=100m inactive=60m use_temp_path=off;

    upstream backend {
        server app:8000;
    }

    server {
        listen 80;
        server_name localhost;

        location / {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Tenant-ID $http_x_tenant_id;

            # VULNERABILITY V3: Cache key trusts client header without cryptographic backend binding
            proxy_cache TENANT_CACHE_V3;
            proxy_cache_key "$scheme$request_method$host$request_uri|$http_x_tenant_id";
            proxy_cache_valid 200 10m;
            proxy_ignore_headers Cache-Control Expires;

            add_header X-Cache-Status $upstream_cache_status always;
            add_header X-TenantCache-Config "VULNERABLE_V3_UNVALIDATED_HEADER" always;
        }
    }
}
