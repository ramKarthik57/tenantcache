# Vulnerability Archetype V4: Stale Authorization After Revocation (Revocation Lag)
# Root Cause: The proxy caches responses for a prolonged duration without dynamic
# invalidation hooks (cache purging) when user permissions are altered or revoked at origin.
# A revoked user continues to retrieve cached 200 OK responses.

events { worker_connections 1024; }

http {
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=TENANT_CACHE_V4:10m max_size=100m inactive=60m use_temp_path=off;

    upstream backend {
        server app:8000;
    }

    server {
        listen 80;
        server_name localhost;

        location / {
            proxy_pass http://backend;
            proxy_set_header Host $host;

            # VULNERABILITY V4: Key includes auth token, but proxy caches for 30 minutes without revalidation
            proxy_cache TENANT_CACHE_V4;
            proxy_cache_key "$scheme$request_method$host$request_uri|$http_authorization";
            proxy_cache_valid 200 30m;
            proxy_ignore_headers Cache-Control Expires;

            add_header X-Cache-Status $upstream_cache_status always;
            add_header X-TenantCache-Config "VULNERABLE_V4_STALE_REVOCATION" always;
        }
    }
}
