# Vulnerability Archetype V2: Missing User Authorization Context in Cache Key
# Root Cause: While the cache key may include a tenant identifier, it does NOT include
# the user identity or role. Private user resources (/api/v1/user/profile) or admin audit logs
# are cached and served to standard users within the same tenant.

events { worker_connections 1024; }

http {
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=TENANT_CACHE_V2:10m max_size=100m inactive=60m use_temp_path=off;

    upstream backend {
        server app:8000;
    }

    server {
        listen 80;
        server_name localhost;

        location / {
            proxy_pass http://backend;
            proxy_set_header Host $host;

            # VULNERABILITY V2: Tenant is keyed, but user authorization token/identity is omitted
            proxy_cache TENANT_CACHE_V2;
            proxy_cache_key "$scheme$request_method$host$request_uri$http_x_tenant_id";
            proxy_cache_valid 200 10m;
            proxy_ignore_headers Cache-Control Expires;

            add_header X-Cache-Status $upstream_cache_status always;
            add_header X-TenantCache-Config "VULNERABLE_V2_MISSING_USER_AUTH" always;
        }
    }
}
