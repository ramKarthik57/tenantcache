# Vulnerability Archetype V5: Erroneous Public / Shared Cache Policy
# Root Cause: The proxy honors Cache-Control: public even when Authorization headers are present,
# or developers configure the proxy to cache all 200 responses as shared objects.

events { worker_connections 1024; }

http {
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=TENANT_CACHE_V5:10m max_size=100m inactive=60m use_temp_path=off;

    upstream backend {
        server app:8000;
    }

    server {
        listen 80;
        server_name localhost;

        location / {
            proxy_pass http://backend;
            proxy_set_header Host $host;

            # VULNERABILITY V5: Shared caching forced across all clients
            proxy_cache TENANT_CACHE_V5;
            proxy_cache_key "$scheme$request_method$host$request_uri";
            proxy_cache_valid 200 1h;

            add_header X-Cache-Status $upstream_cache_status always;
            add_header X-TenantCache-Config "VULNERABLE_V5_ERRONEOUS_PUBLIC" always;
        }
    }
}
