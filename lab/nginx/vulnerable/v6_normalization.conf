# Vulnerability Archetype V6: Normalization and Suffix Inconsistency
# Root Cause: The proxy treats URL variations (case, trailing slash, unnormalized query parameters)
# inconsistently between caching and routing layers, causing cache partition bypass.

events { worker_connections 1024; }

http {
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=TENANT_CACHE_V6:10m max_size=100m inactive=60m use_temp_path=off;

    upstream backend {
        server app:8000;
    }

    server {
        listen 80;
        server_name localhost;

        location / {
            proxy_pass http://backend;
            proxy_set_header Host $host;

            # VULNERABILITY V6: Cache key uses raw $uri instead of canonicalized $request_uri
            proxy_cache TENANT_CACHE_V6;
            proxy_cache_key "$scheme$request_method$host$uri";
            proxy_cache_valid 200 10m;
            proxy_ignore_headers Cache-Control Expires;

            add_header X-Cache-Status $upstream_cache_status always;
            add_header X-TenantCache-Config "VULNERABLE_V6_NORMALIZATION_INCONSISTENCY" always;
        }
    }
}
