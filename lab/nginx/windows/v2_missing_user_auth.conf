worker_processes  1;

events {
    worker_connections  1024;
}

http {
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    proxy_cache_path temp/cache_v2 levels=1:2 keys_zone=TENANT_CACHE_V2:10m max_size=100m inactive=60m use_temp_path=off;

    server {
        listen       8080;
        server_name  localhost;

        location / {
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            # VULNERABILITY V2: Tenant is keyed, but user identity is omitted
            proxy_cache TENANT_CACHE_V2;
            proxy_cache_key "$scheme$request_method$host$request_uri$http_x_tenant_id";
            proxy_cache_valid 200 10m;
            proxy_ignore_headers Cache-Control Expires;

            add_header X-Cache-Status $upstream_cache_status always;
            add_header X-TenantCache-Config "REAL_NGINX_V2_MISSING_USER_AUTH" always;
        }
    }
}
