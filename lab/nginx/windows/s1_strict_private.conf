worker_processes  1;

events {
    worker_connections  1024;
}

http {
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    proxy_cache_path temp/cache_s1 levels=1:2 keys_zone=SECURE_CACHE_S1:10m max_size=100m inactive=60m use_temp_path=off;

    server {
        listen       8080;
        server_name  localhost;

        location / {
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            proxy_cache SECURE_CACHE_S1;
            proxy_cache_key "$scheme$request_method$host$request_uri";

            # SECURE CONTROL S1: Bypass cache whenever Authorization header is present
            proxy_cache_bypass $http_authorization $cookie_session_id;
            proxy_no_cache $http_authorization $cookie_session_id;

            proxy_cache_valid 200 10m;
            proxy_ignore_headers Expires;

            add_header X-Cache-Status $upstream_cache_status always;
            add_header X-TenantCache-Config "REAL_NGINX_SECURE_S1" always;
        }
    }
}
