name: Security Scan & SAST

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  schedule:
    - cron: '0 6 * * 1'

jobs:
  sast-scan:
    name: Bandit SAST & Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Static Analysis Tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install bandit pip-audit

      - name: Run Bandit Static Security Scanner
        run: |
          # Scan src/ package with Bandit, ignoring test assert warnings in lab
          bandit -r src/ -ll -ii

      - name: Audit Dependency Vulnerabilities
        run: |
          python -m pip install -r constraints.txt
          pip-audit --desc on || true
