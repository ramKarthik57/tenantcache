[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tenantcache"
version = "1.1.0"
description = "Automated Differential Verification of Cache Isolation in Multi-Tenant Web Applications"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Ramkumar V.", email = "ramkumar.v@research.tenantcache.org" },
    { name = "Advanced Systems & Cybersecurity Research Group" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security"
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pandas>=2.2.0",
    "pytest>=8.0.0",
    "hypothesis>=6.98.0",
    "tabulate>=0.9.0",
    "python-dotenv>=1.0.0"
]

[project.scripts]
tenantcache = "tenantcache.cli:app"

[tool.setuptools]
packages = ["tenantcache", "tenantcache.cache", "tenantcache.detection", "tenantcache.differential", "tenantcache.evaluation", "tenantcache.generator", "tenantcache.models", "tenantcache.oracle", "tenantcache.reporting", "tenantcache.simulator", "lab", "lab.application"]
package-dir = {"" = "src", "lab" = "lab"}

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = [".", "src"]
